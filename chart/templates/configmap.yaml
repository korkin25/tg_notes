apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tg-notes.fullname" . }}-env
  labels:
    {{- include "tg-notes.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- if .Values.voiceModel.enabled }}
  # Point the Whisper / HuggingFace caches at the voice-model PVC.
  HF_HOME: {{ .Values.voiceModel.mountPath | quote }}
  XDG_CACHE_HOME: {{ .Values.voiceModel.mountPath | quote }}
  {{- end }}
