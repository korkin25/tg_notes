{{- if .Values.persistence.enabled -}}
# Config dir PVC — holds the Telethon *.session credential (seed it once with
# `tg-notes login`; treat it as a private key). See chart/README.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "tg-notes.fullname" . }}-config
  labels:
    {{- include "tg-notes.labels" . | nindent 4 }}
  {{- with .Values.persistence.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
