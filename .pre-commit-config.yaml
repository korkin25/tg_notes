# Local pre-commit — install with `pre-commit install`.
# ONLY gitleaks (secret scanning), run via Docker so no local binary or Go toolchain is
# needed (works everywhere Docker is available). All other lint/scan gates
# (yamllint, hadolint, checkov, trivy, ...) run in CI, not here.
---
repos:
  - repo: local
    hooks:
      - id: gitleaks-docker
        name: gitleaks (docker) — secret scan
        language: docker_image
        entry: zricethezav/gitleaks:v8.30.1 dir . --redact --no-banner --exit-code 1
        pass_filenames: false
