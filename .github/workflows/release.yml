name: Release

# Triggered by pushing a SemVer tag (vX.Y.Z). Builds the distribution and
# publishes it to PyPI.
#
# NOTE: publishing requires a PyPI API token stored as the `PYPI_API_TOKEN`
# repository secret (or a Trusted Publisher configuration). Publishing is a
# deliberate, later step — the workflow only runs when a `v*` tag is pushed,
# which happens only after the full test suite is green on `main`.

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build backend
        run: pip install build
      - name: Build distribution
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
