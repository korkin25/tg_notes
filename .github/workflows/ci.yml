# -----------------------------------------------------------------------------
# CI — composed from the public reusable workflows in korkin25/open-ci-actions@v1.
# This IS the reference composition (copy it into a new project as-is).
# -----------------------------------------------------------------------------
#
# Every job self-activates from the repository contents — jobs that do not apply
# skip themselves, they do not fail, and they cost nothing. New shared jobs belong
# in open-ci-actions, not here.
#
#   detect      inspects the checkout once and exports boolean-ish flags
#   version     one SemVer (GitVersion) shared by the image and the chart
#   python      ruff + mypy + pytest per interpreter, radon/xenon report
#   sast        gitleaks, semgrep, bandit, pip-audit, checkov, hadolint, trivy-config
#   docker      buildx build -> trivy scan -> push to GHCR on dev/rc/release and tags
#   helm        lint + template always, package + OCI push to GHCR on tags
#   functional  runs the repository's own auto-tests/group-a/*.sh scripts
#   release     sdist + wheel -> PyPI via Trusted Publishing on a v* tag
#
# Delete any job you do not want; nothing else needs editing — there is no umbrella
# workflow that would break when a piece is missing.
#
# Pinning: @v1 is a moving major tag (fixes and new inputs, no breaking changes).
# Pin @v1.2.3 or a commit SHA if you want bit-for-bit reproducibility instead.
# -----------------------------------------------------------------------------
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default. Only the two jobs that publish to GHCR and the one that
# talks to PyPI widen this, and they widen it for themselves alone.
permissions:
  contents: read

# A new push to the same ref supersedes the previous run. Pull requests are cancelled
# (cheap feedback), branch and tag builds are allowed to finish (they publish artifacts).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. What kind of repository is this?
  # GitHub Actions has no equivalent of GitLab's `rules:exists`, so one cheap job
  # answers the question once and every `if:` below reads its outputs.
  # ---------------------------------------------------------------------------
  detect:
    name: Detect
    runs-on: ubuntu-latest
    outputs:
      has-python: ${{ steps.detect.outputs.has-python }}
      has-dockerfile: ${{ steps.detect.outputs.has-dockerfile }}
      has-chart: ${{ steps.detect.outputs.has-chart }}
      has-tests: ${{ steps.detect.outputs.has-tests }}
      python-package-dir: ${{ steps.detect.outputs.python-package-dir }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        uses: korkin25/open-ci-actions/actions/detect-project@v1
        # The defaults are spelled out for readability — drop the whole `with:` block
        # to accept them, or point them at your layout (chart-path: deploy/chart, ...).
        with:
          dockerfile: Dockerfile
          chart-path: chart
          tests-dir: auto-tests/group-a
          tests-glob: "*.sh"

  # ---------------------------------------------------------------------------
  # 2. One version for everything this pipeline publishes.
  # GitVersion reads the branch/tag graph, so the checkout MUST be deep.
  # ---------------------------------------------------------------------------
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.gitversion.outputs.semver }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required: GitVersion needs the full history
      - id: gitversion
        uses: korkin25/open-ci-actions/actions/gitversion@v1

  # ---------------------------------------------------------------------------
  # 3. Language gates — Python only, and only when the repo actually is one.
  # ---------------------------------------------------------------------------
  python:
    name: Python
    needs: detect
    if: needs.detect.outputs.has-python == 'true'
    uses: korkin25/open-ci-actions/.github/workflows/python.yml@v1
    with:
      # A JSON array in a string: reusable-workflow inputs cannot be lists, so the
      # workflow parses this into its own `strategy.matrix`.
      python-versions: '["3.11","3.12"]'
      # 'src' on a src-layout project, '.' otherwise — decided by detect-project.
      lint-paths: tg_notes
      dev-extra: dev
      pytest-args: -q

  # ---------------------------------------------------------------------------
  # 4. Security scanners — no `if:`, they apply to every repository.
  # The workflow gates its own Python-only and Dockerfile-only jobs on these flags,
  # so a Go repo without a Dockerfile still gets gitleaks, semgrep, checkov and trivy.
  # ---------------------------------------------------------------------------
  sast:
    name: SAST
    needs: detect
    permissions:
      contents: read
      # Lets the scanners publish SARIF to the repository's Security tab. Without it the
      # uploads are skipped (they are continue-on-error) and the gates still work — you
      # just lose the annotated findings.
      security-events: write
    uses: korkin25/open-ci-actions/.github/workflows/sast.yml@v1
    with:
      has-python: ${{ needs.detect.outputs.has-python }}
      has-dockerfile: ${{ needs.detect.outputs.has-dockerfile }}
      bandit-target: tg_notes
      dockerfile: Dockerfile
      semgrep-configs: p/security-audit p/secrets

  # ---------------------------------------------------------------------------
  # 5. Container image. Builds on every ref, publishes only from the release
  # branches and from tags — a fork or a feature branch never pushes to GHCR.
  # ---------------------------------------------------------------------------
  docker:
    name: Image
    needs: [detect, version]
    if: needs.detect.outputs.has-dockerfile == 'true'
    permissions:
      contents: read
      packages: write # GHCR push, via the built-in GITHUB_TOKEN — no PAT needed
    uses: korkin25/open-ci-actions/.github/workflows/docker.yml@v1
    with:
      dockerfile: Dockerfile
      image-name: tg-notes
      version: ${{ needs.version.outputs.semver }}
      push-branches: dev,rc,release
      platforms: linux/amd64

  # ---------------------------------------------------------------------------
  # 6. Helm chart. Lint and template on every ref; the OCI push happens on tags.
  # ---------------------------------------------------------------------------
  helm:
    name: Chart
    needs: [detect, version]
    if: needs.detect.outputs.has-chart == 'true'
    permissions:
      contents: read
      packages: write
    uses: korkin25/open-ci-actions/.github/workflows/helm.yml@v1
    with:
      chart-path: chart
      # Same SemVer as the image: one commit, one version, everywhere.
      version: ${{ needs.version.outputs.semver }}

  # ---------------------------------------------------------------------------
  # 7. Functional tests — the repository's own scripts decide what "works" means.
  #
  # `docker` is skipped on a repo without a Dockerfile, and a skipped dependency
  # would normally skip this job too. `!cancelled()` re-enables it: the tests run
  # whenever they exist and the image job did not FAIL. image-ref is then empty,
  # and a script that needs an image exits 77 and is reported as skipped.
  # ---------------------------------------------------------------------------
  functional:
    name: Functional
    needs: [detect, docker]
    if: >-
      ${{ !cancelled()
      && needs.detect.outputs.has-tests == 'true'
      && needs.docker.result != 'failure' }}
    uses: korkin25/open-ci-actions/.github/workflows/functional.yml@v1
    with:
      tests-dir: auto-tests/group-a
      tests-glob: "*.sh"
      image-ref: ${{ needs.docker.outputs.image-ref }}

  # ---------------------------------------------------------------------------
  # 8. Publish to PyPI on a version tag, gated behind the Python job.
  # Trusted Publishing: the job mints a short-lived OIDC token, so there is no
  # PyPI API token to store or rotate. Configure the publisher on PyPI once.
  # ---------------------------------------------------------------------------
  release:
    name: PyPI
    needs: [detect, python]
    if: startsWith(github.ref, 'refs/tags/v') && needs.detect.outputs.has-python == 'true'
    permissions:
      id-token: write # OIDC identity for PyPI Trusted Publishing
      contents: read
    uses: korkin25/open-ci-actions/.github/workflows/release.yml@v1
    with:
      python-version: "3.12"

  # ---------------------------------------------------------------------------
  # 9. Bespoke: real-Telegram end-to-end suite. Not part of open-ci-actions —
  # it needs this project's dedicated test account. Skips cleanly when the
  # session secret is absent (forks / unconfigured repos stay green).
  # ---------------------------------------------------------------------------
  live-functional:
    name: Live-functional (real Telegram)
    needs: [detect, python]
    # This suite talks to ONE real Telegram account. A branch with an open PR gets both a
    # `push` and a `pull_request` run for the same SHA; running two live suites against the
    # same account at once throttles Telegram and makes reads flaky (a fresh forum topic can
    # read back empty under load). So run it on `push` — which tests the exact SHA — and skip
    # the duplicate same-repo `pull_request` run. Fork PRs carry no secrets and self-skip via
    # the SESSION guard below.
    if: >-
      needs.detect.outputs.has-python == 'true'
      && !(github.event_name == 'pull_request'
           && github.event.pull_request.head.repo.full_name == github.repository)
    # Belt-and-suspenders: never let two live suites overlap (e.g. pushes on two branches).
    concurrency:
      group: live-functional-telegram
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: ci-functional
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e .[dev]
      - name: Seed a throwaway config and run the gated live suite
        env:
          TG_NOTES_API_ID: ${{ secrets.TG_NOTES_API_ID }}
          TG_NOTES_API_HASH: ${{ secrets.TG_NOTES_API_HASH }}
          TG_NOTES_SESSION: ${{ secrets.TG_NOTES_SESSION }}
          TG_NOTES_TEST_GROUP: ${{ vars.TG_NOTES_TEST_GROUP }}
        run: |
          if [ -z "${TG_NOTES_SESSION:-}" ]; then
            echo "TG_NOTES_SESSION not set — skipping live-functional."
            exit 0
          fi
          export TG_NOTES_SANDBOX_DIR="$RUNNER_TEMP/tgn-sandbox"
          rc=0
          python scripts/sandbox.py pytest -- \
            tests/test_live_functional.py \
            tests/test_live_mcp.py \
            tests/test_live_media.py -v || rc=$?
          echo "== cleanup: purge the dedicated test group =="
          TG_NOTES_CONFIG_DIR="$TG_NOTES_SANDBOX_DIR" python scripts/cleanup_live.py purge || true
          exit $rc
